<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Tracker — SFRS(I) &amp; SSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F2F0EB;--card:#FFFFFF;--ink:#24231F;--ink2:#4A4740;--muted:#78746C;--line:#E3DED5;--soft:#F7F5F1;--soft2:#EDE9E2;
  --accent:#D45F1E;--accent-ink:#9C410D;--accent-soft:#FCEBDF;--r:14px;
}
*{box-sizing:border-box}
html{font-size:17px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
header.top{position:sticky;top:0;z-index:30;background:rgba(242,240,235,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1.1rem;white-space:nowrap}
.brand .dot{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.eng{color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
nav.tabs{display:flex;gap:4px;margin-left:auto;background:var(--soft2);padding:4px;border-radius:12px;flex-wrap:wrap}
nav.tabs a{padding:8px 16px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:.95rem}
nav.tabs a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}
nav.tabs a .cnt{display:inline-block;margin-left:6px;font-size:.78rem;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;vertical-align:1px}
main{max-width:1240px;margin:0 auto;padding:30px 24px 90px}
h1{font-size:1.85rem;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600;margin:0 0 14px}
h3{font-size:1.12rem;font-weight:600;margin:0}
.sub{color:var(--muted);margin:0 0 24px;max-width:780px}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head-row .sub{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.stack{display:flex;flex-direction:column;gap:14px}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.cols>*,.std-layout>*,.stack>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.kpi .lbl{color:var(--muted);font-size:.9rem}
.kpi .val{font-size:2rem;font-weight:600;margin-top:2px;line-height:1.2}
.kpi .val.accent{color:var(--accent)}
.kpi .foot{color:var(--muted);font-size:.85rem;margin-top:6px}
.meter{height:10px;background:var(--soft2);border-radius:99px;position:relative;margin-top:12px;overflow:visible}
.meter i{display:block;height:100%;border-radius:99px;background:#9E978B}
.meter i.over{background:var(--accent)}
.meter b{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink2);border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:#CFC8BC;background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{padding:6px 12px;font-size:.88rem;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--soft2)}
.btn.danger{color:#8B2E12}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.r-High{background:var(--accent);color:#fff}
.r-Medium{background:var(--accent-soft);color:var(--accent-ink)}
.r-Low{background:var(--soft2);color:var(--ink2)}
.r-Trivial{background:transparent;color:var(--muted);border:1px solid var(--line)}
.prio{background:var(--ink);color:#fff}
.prio.P2{background:#6B665D}.prio.P3{background:#A39D92}
.tag{display:inline-flex;font-size:.82rem;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.auto{border-style:dashed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;padding:4px 11px;border-radius:8px;background:var(--soft);border:1px solid var(--line);cursor:pointer;color:var(--ink);font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip.sfrs{background:#fff}
.chip .x{color:var(--muted);font-weight:400;margin-left:2px}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:5px;font-weight:500}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:1rem;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:84px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.hr{height:1px;background:var(--line);margin:18px 0}
/* Issues */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .in{width:auto;min-width:150px;padding:9px 12px}
.toolbar .search{flex:1;min-width:220px}
.issue{display:grid;grid-template-columns:64px 1fr 210px;gap:20px;padding:22px 24px;position:relative}
.issue.closed{opacity:.62}
.issue .rank{font-size:1.6rem;font-weight:600;color:var(--muted);line-height:1}
.issue .rank small{display:block;font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.issue.r1 .rank{color:var(--accent)}
.issue .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.issue h3{margin-bottom:6px}
.issue .desc{color:var(--ink2);margin:0 0 14px;white-space:pre-line}
.meta{display:grid;grid-template-columns:auto 1fr 1.6fr;gap:12px 26px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px}
.meta .k{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-bottom:2px}
.meta .amt{font-size:1.25rem;font-weight:500}
.where{display:flex;flex-direction:column;gap:6px}
.path{font-size:.95rem;word-break:break-word}
.path .sep{color:var(--muted);margin:0 4px}
.refs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side{display:flex;flex-direction:column;gap:10px}
.side select{padding:8px 10px;font-size:.92rem}
.empty{text-align:center;padding:56px 24px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
/* Files */
.drop{border:2px dashed #CFC8BC;border-radius:var(--r);padding:34px;text-align:center;background:var(--soft);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:1.15rem;margin-bottom:4px}
.file-list{display:flex;flex-direction:column;gap:10px}
.fitem{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:#fff}
.fitem.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fitem .ic{width:36px;height:36px;border-radius:9px;background:var(--soft2);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--ink2)}
.fitem .nm{font-weight:500;word-break:break-all}
.sheet-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sheet-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.sheet-tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.map-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tests{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 18px}
.tests label{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;cursor:pointer}
.tests input{margin-top:5px;accent-color:var(--accent);width:16px;height:16px}
.tests .r{color:var(--muted);font-size:.8rem;display:block}
.results{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.res{display:flex;gap:10px;align-items:center;font-size:.93rem;padding:8px 12px;border-radius:9px;background:var(--soft)}
.res .st{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.st.pass{background:#E4E9E1;color:#3F5537}.st.flag{background:var(--accent);color:#fff}.st.skip{background:var(--soft2);color:var(--muted)}
.gridwrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:12px;background:#fff}
table.grid{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:100%}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 10px;white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
table.grid thead th{position:sticky;top:0;background:var(--soft2);z-index:2;font-weight:500;color:var(--muted);text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.8rem}
table.grid tbody th{position:sticky;left:0;background:var(--soft);color:var(--muted);font-weight:400;font-family:'IBM Plex Mono',monospace;font-size:.8rem;text-align:right;z-index:1}
table.grid thead th:first-child{left:0;z-index:3}
table.grid tr.hdr td{font-weight:600;background:#FBFAF7}
table.grid td.n{text-align:right;font-family:'IBM Plex Mono',monospace}
table.grid tr.hl td{background:#FFF6EF}
table.grid tr.hl th{background:var(--accent);color:#fff}
table.grid td.hc{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent);font-weight:600;color:var(--accent-ink)}
.hl-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid #F3CDB3;border-radius:12px;padding:12px 16px;margin-bottom:12px;color:var(--accent-ink);flex-wrap:wrap}
/* Standards */
.std-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.std-list{position:sticky;top:92px;max-height:calc(100vh - 120px);overflow:auto;padding:14px}
.std-list .grp{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:14px 8px 6px}
.std-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:9px;cursor:pointer}
.std-item:hover{background:var(--soft)}
.std-item.on{background:var(--soft2)}
.std-item .c{font-weight:600;font-size:.95rem}
.std-item .n{font-size:.85rem;color:var(--muted);line-height:1.35}
.std-item .lk{float:right;font-size:.75rem;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;margin-top:3px}
.para{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:#fff;scroll-margin-top:110px}
.para .p{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-weight:500}
.para.hl{border-color:var(--accent);background:#FFFAF6;box-shadow:inset 4px 0 0 var(--accent)}
.para.hl .p{color:var(--accent)}
.para .txt{font-size:1.05rem;line-height:1.6}
.para mark{background:transparent;color:inherit;border-bottom:2px solid #E8B898;padding:0 1px}
.para.hl mark{background:#FAD9C2;border-bottom-color:var(--accent);color:var(--ink);border-radius:3px}
.para .lnk{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{font-size:.86rem;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 14px;line-height:1.45}
/* Dashboard */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:170px 1fr 34px;gap:12px;align-items:center;font-size:.93rem}
.bar .t{height:10px;background:var(--soft2);border-radius:99px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%;background:#A39D92}
.bar .t i.h{background:var(--accent)}
.mini{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mini:last-child{border-bottom:0}
.mini:hover .tt{color:var(--accent-ink)}
.mini .rk{font-weight:600;color:var(--muted)}
.mini .tt{font-weight:500}
/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(36,35,31,.38);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:820px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal.sm{max-width:480px}
.modal h2{font-size:1.35rem}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:60;max-width:90vw;font-size:.95rem}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* Auth & users */
body:not(.authed) header.top{display:none}
body:not(.authed) main{padding:0;max-width:none}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{max-width:430px;width:100%;padding:36px 34px}
.login .brand{font-size:1.35rem;margin-bottom:4px}
.login h1{font-size:1.5rem;margin:22px 0 4px}
.login .btn.primary{width:100%;justify-content:center;padding:12px;font-size:1rem;margin-top:6px}
.err{background:#FBE7E1;color:#8B2E12;border-radius:10px;padding:10px 14px;font-size:.92rem}
.ok-msg{background:var(--soft2);color:var(--ink2);border-radius:10px;padding:10px 14px;font-size:.92rem}
.userbox{position:relative;display:flex;align-items:center;gap:12px}
.sync{font-size:.8rem;color:var(--muted);white-space:nowrap;cursor:default}
.sync.err{color:#8B2E12;cursor:pointer;text-decoration:underline}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.9rem;border:0;cursor:pointer;flex:none}
.avatar.admin{background:var(--accent)}
.avatar.lg{width:42px;height:42px;cursor:default}
.avatar.off{background:#B9B3A8}
.menu{position:absolute;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.12);padding:8px;min-width:230px;display:none;z-index:40}
.menu.on{display:block}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.95rem}
.menu button:hover{background:var(--soft)}
.urow{display:grid;grid-template-columns:42px 1fr auto auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .nm{font-weight:600}
.urow.inactive{opacity:.6}
.migrate{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;border-color:#F3CDB3;background:#FFFAF6}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols,.std-layout{grid-template-columns:1fr}
  .std-list{position:static;max-height:none}
  .issue{grid-template-columns:1fr}
  .issue .rank{display:flex;gap:8px;align-items:baseline}
  .meta{grid-template-columns:1fr 1fr}
  .map-grid{grid-template-columns:repeat(2,1fr)}
  .tests{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap}
  .urow{grid-template-columns:42px 1fr;}
  .urow>.btn-row,.urow>.ust{grid-column:2}
}
@media (max-width:600px){
  html{font-size:16px}
  .form-grid,.form-grid.three{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}
  nav.tabs{margin-left:0;width:100%}
  .bar{grid-template-columns:110px 1fr 28px}
  main{padding:22px 14px 80px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="dot"></span>Audit Tracker</div>
  <div class="eng" id="engLabel"></div>
  <nav class="tabs" id="tabs">
    <a href="#dashboard" data-v="dashboard">Overview</a>
    <a href="#issues" data-v="issues">Issues</a>
    <a href="#files" data-v="files">Files &amp; tests</a>
    <a href="#standards" data-v="standards">Standards</a>
    <a href="#users" data-v="users" id="usersTab" hidden>Users</a>
  </nav>
  <div class="userbox" id="userbox"></div>
</div></header>
<main id="app"></main>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden>

<script>
/* =====================================================================
   Reference library — paraphrased summaries (not verbatim text).
   SSA = Singapore Standards on Auditing (ACRA); SFRS(I) = Singapore
   Financial Reporting Standards (International) (ASC).
   Each paragraph: [para, summary, key phrase to highlight]
   ===================================================================== */
const STD=[
 {code:'SSA 200',fam:'SSA',name:'Overall Objectives of the Independent Auditor',paras:[
  ['15','The auditor plans and performs the audit with professional skepticism, recognising that circumstances may exist that cause the financial statements to be materially misstated.','professional skepticism'],
  ['17','To obtain reasonable assurance, the auditor obtains sufficient appropriate audit evidence to reduce audit risk to an acceptably low level, enabling reasonable conclusions on which to base the opinion.','sufficient appropriate audit evidence']]},
 {code:'SSA 230',fam:'SSA',name:'Audit Documentation',paras:[
  ['8','Documentation must allow an experienced auditor with no previous connection to the audit to understand the procedures performed, the evidence obtained, and the significant matters and conclusions reached.','experienced auditor with no previous connection'],
  ['9','When documenting procedures, record the identifying characteristics of the specific items tested, who performed the work and when, and who reviewed it, the date and extent of review.','identifying characteristics of the specific items tested']]},
 {code:'SSA 240',fam:'SSA',name:"Auditor's Responsibilities Relating to Fraud",paras:[
  ['26','There is a presumption that risks of fraud exist in revenue recognition; the auditor evaluates which revenue types, transactions or assertions give rise to such risks.','risks of fraud exist in revenue recognition'],
  ['31','Management override of controls is a risk present in all entities and is treated as a significant risk.','Management override of controls'],
  ['32','Irrespective of the assessed risk of override, the auditor designs procedures to (a) test the appropriateness of journal entries and other adjustments, including those made at the end of the reporting period, (b) review accounting estimates for bias, and (c) evaluate the business rationale of significant unusual transactions.','test the appropriateness of journal entries and other adjustments'],
  ['35','When a misstatement is identified, the auditor evaluates whether it is indicative of fraud and, if so, its implications for other aspects of the audit, including the reliability of management representations.','evaluates whether it is indicative of fraud']]},
 {code:'SSA 315',fam:'SSA',name:'Identifying and Assessing the Risks of Material Misstatement (Revised 2019)',paras:[
  ['13','Risk assessment procedures are designed and performed to obtain evidence that provides an appropriate basis for identifying and assessing risks of material misstatement.','appropriate basis for identifying and assessing'],
  ['28','The auditor identifies risks of material misstatement and determines whether they exist at the financial statement level or at the assertion level.','financial statement level or at the assertion level'],
  ['32','The auditor determines whether any of the assessed risks of material misstatement are significant risks.','significant risks']]},
 {code:'SSA 320',fam:'SSA',name:'Materiality in Planning and Performing an Audit',paras:[
  ['10','When establishing the overall audit strategy, determine materiality for the financial statements as a whole and, where relevant, lower amounts for particular classes of transactions, balances or disclosures.','materiality for the financial statements as a whole'],
  ['11','Determine performance materiality to reduce to an appropriately low level the probability that aggregate uncorrected and undetected misstatements exceed materiality.','performance materiality'],
  ['12','Revise materiality if information becomes known during the audit that would have caused a different amount to be determined initially.','Revise materiality']]},
 {code:'SSA 330',fam:'SSA',name:"Auditor's Responses to Assessed Risks",paras:[
  ['18','Irrespective of the assessed risks, design and perform substantive procedures for each material class of transactions, account balance and disclosure.','each material class of transactions, account balance and disclosure'],

function issuesCSV(){const rm=rankMap();const cols=['Rank','Title','Risk','Priority','Category','Assertion','Status','Misstatement type','Amount','FS line item','File','Sheet','Cells','Location note','References','Owner','Description'];

const MAXROWS=5000;
const FIELDS=[['date','Date'],['ref','JE / Ref no.'],['account','Account'],['desc','Description'],['debit','Debit'],['credit','Credit'],['amount','Amount (signed)'],['user','Posted by']];
const MATCH={date:/date|period/i,debit:/^(dr|debit)\b|debit/i,credit:/^(cr|credit)\b|credit/i,amount:/amount|value|balance|net|sgd|usd/i,account:/account|a\/c|gl|ledger|code/i,desc:/desc|narr|memo|particular|detail|text|remark/i,ref:/je|journal|voucher|ref|doc|entry|txn|no\.?$/i,user:/user|posted|prepared|by|creator|maker/i};
function detectHeader(rows){for(let i=0;i<Math.min(15,rows.length);i++){const r=rows[i]||[];const ne=r.filter(v=>v!==''&&v!=null);const str=ne.filter(v=>typeof v==='string'&&isNaN(toNum(v)));if(ne.length>=2&&str.length>=Math.max(2,ne.length*.6))return i}return 0}
function autoMap(h){const m={};FIELDS.forEach(([k])=>m[k]=-1);const used=new Set();['date','debit','credit','amount','account','desc','ref','user'].forEach(k=>{for(let c=0;c<h.length;c++){if(used.has(c))continue;const s=String(h[c]||'');if(s&&MATCH[k].test(s)){m[k]=c;used.add(c);break}}});return m}
function normCell(v){if(v instanceof Date){let d=v;if(d.getHours()===23&&d.getMinutes()>=50)d=new Date(d.getTime()+3600e3);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}if(typeof v==='string')return v.trim();return v}
function mkSheet(rows,r0,c0){const total=rows.length;rows=rows.slice(0,MAXROWS);const H=detectHeader(rows);return{rows,r0,c0,total,truncated:total>MAXROWS,headerRow:H,map:autoMap(rows[H]||[]),lastRun:null}}
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}if(f||row.length){row.push(f);rows.push(row)}return rows.map(r=>r.map(v=>{const n=toNum(v);return v!==''&&!isNaN(n)&&n!==null&&/^[-\d.,()\s]+$/.test(v)?n:v.trim()}))}
async function handleFiles(list){
 let added=0;
 for(const f of list){
  try{const buf=await f.arrayBuffer();const sheets={},order=[];
   if(/\.csv$/i.test(f.name)){sheets.Sheet1=mkSheet(parseCSV(new TextDecoder().decode(buf)),0,0);order.push('Sheet1')}
   else{if(!window.XLSX)throw new Error('The Excel reader did not load. Check your connection, or upload a .csv export.');
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    for(const sn of wb.SheetNames){const ws=wb.Sheets[sn];if(!ws||!ws['!ref'])continue;const rg=XLSX.utils.decode_range(ws['!ref']);const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:'',blankrows:true}).map(r=>r.map(normCell));sheets[sn]=mkSheet(rows,rg.s.r,rg.s.c);order.push(sn)}}
   if(!order.length)throw new Error('No data found in the workbook.');
   const file={id:uid(),name:f.name,size:f.size,uploaded:Date.now(),sheets,order};FILES.push(file);added++;
   SEL={fileId:file.id,sheet:order[0]};HL=null;
  }catch(e){toast(`Could not read ${f.name}: ${e.message}`)}}
 if(added){saveFiles();if(view!=='files')go('files');else render();toast(`${added} file${added>1?'s':''} loaded — check the column mapping, then run tests`)}}

function runTests(fid,sn,sel){
 const f=FILES.find(x=>x.id===fid),sh=f.sheets[sn],m=sh.map,t=th(),pe=parseDate(S.eng.periodEnd);
 const H=sh.headerRow,data=[];
 for(let i=H+1;i<sh.rows.length;i++){const row=sh.rows[i];if(!row||row.every(v=>v===''||v==null))continue;if(m.account>=0&&/^(total|grand total|sub-?total)/i.test(String(row[m.account]||'')))continue;if(m.desc>=0&&/^(total|grand total)/i.test(String(row[m.desc]||'')))continue;data.push({i,row})}
 const L=(i,c)=>({r:sh.r0+i,c:sh.c0+c});
 const hasDC=m.debit>=0||m.credit>=0,hasAmt=m.amount>=0||hasDC;
 const num=v=>{const n=toNum(v);return n==null||isNaN(n)?0:n};
 const amt=row=>m.amount>=0?num(row[m.amount]):num(m.debit>=0?row[m.debit]:0)-num(m.credit>=0?row[m.credit]:0);
 const amtCol=row=>m.amount>=0?m.amount:(m.debit>=0&&num(row[m.debit])!==0?m.debit:(m.credit>=0?m.credit:m.debit));
 const text=row=>[m.account>=0?row[m.account]:'',m.desc>=0?row[m.desc]:''].join(' ');
 const cellsOf=rs=>rs.map(d=>L(d.i,amtCol(d.row)));
 const gross=rs=>{let p=0,a=0;rs.forEach(d=>{const v=amt(d.row);if(v>0)p+=v;a+=Math.abs(v)});return p>0?p:a};
 const refsFor=rs=>{const s=new Set();rs.slice(0,40).forEach(d=>kw(text(d.row)).refs.forEach(r=>s.add(r)));return[...s].slice(0,4)};
 const lineFor=rs=>{const c={};rs.forEach(d=>{const l=kw(text(d.row)).line;if(l)c[l]=(c[l]||0)+1});const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]+(e.length>1?' (+'+(e.length-1)+' more)':''):''};
 const sample=(rs,k=4)=>rs.slice(0,k).map(d=>`Row ${sh.r0+d.i+1}: ${[m.date>=0?d.row[m.date]:'',m.ref>=0?d.row[m.ref]:'',m.account>=0?d.row[m.account]:'',m.desc>=0?d.row[m.desc]:''].filter(Boolean).join(' · ')} — ${fmt(amt(d.row))}`).join('\n');
 const out=[],res=[];
 const add=o=>{const risk=riskMax(o.amount==null?'Low':suggestRisk(o.amount),o.minRisk||'Low');out.push({id:uid(),title:o.title,description:o.description,amount:Math.round((o.amount||0)*100)/100,category:o.category,assertion:o.assertion,risk,minRisk:o.minRisk||'Low',priority:prioFor(risk),status:'Open',misType:'None',fsLine:o.fsLine||'',owner:'',refs:[...new Set(o.refs)],loc:{fileId:fid,fileName:f.name,sheet:sn,cells:(o.cells||[]).slice(0,400),note:''},source:'auto',testId:o.test,created:Date.now()+out.length})};
 const R=(id,st,note)=>res.push({id,name:TESTS.find(x=>x.id===id).name,st,note});
 const run=id=>sel.has(id);
 const isTB=m.date<0&&m.account>=0;const tbSkip=id=>{R(id,'skip','applies to transaction listings — this sheet looks like a trial balance (no date column)')};
 const dated=m.date>=0?data.map(d=>({...d,dt:parseDate(d.row[m.date])})):[];

 if(run('balance')){
  if(!hasAmt)R('balance','skip','map Debit & Credit, or a signed Amount column');
  else if(m.amount>=0&&!hasDC&&!data.some(d=>num(d.row[m.amount])<0))R('balance','skip','amount column has no negative values — map Debit and Credit instead');
  else{let sd=0,sc=0,sa=0;data.forEach(d=>{if(m.debit>=0)sd+=num(d.row[m.debit]);if(m.credit>=0)sc+=num(d.row[m.credit]);sa+=amt(d.row)});
   const diff=Math.round(sa*100)/100;
   if(Math.abs(diff)<0.01)R('balance','pass',hasDC?`debits ${fmt(sd)} = credits ${fmt(sc)}`:'signed amounts net to zero');
   else{let rs=[],jes='';if(m.ref>=0){const g={};data.forEach(d=>{const k=String(d.row[m.ref]);(g[k]=g[k]||[]).push(d)});const bad=Object.entries(g).filter(([,v])=>Math.abs(v.reduce((s,d)=>s+amt(d.row),0))>=0.01);rs=bad.flatMap(([,v])=>v);jes=bad.slice(0,5).map(([k,v])=>`${k} (out by ${fmt(v.reduce((s,d)=>s+amt(d.row),0))})`).join(', ')}
    const nine=Math.round(Math.abs(diff)*100)%9===0;
    add({test:'balance',title:`Ledger out of balance by ${money(Math.abs(diff))}`,description:`Total debits ${fmt(sd)} vs credits ${fmt(sc)}; difference ${fmt(diff)}.`+(jes?`\nUnbalanced journal(s): ${jes}.`:'')+(nine?'\nThe difference is divisible by 9 — a common sign of a transposition error.':'')+'\nAgree the ledger to the trial balance and financial statements before relying on it.',amount:Math.abs(diff),category:'Data integrity',assertion:'Accuracy',minRisk:'Medium',fsLine:lineFor(rs),refs:['SSA 330|20','SSA 500|9','SFRS(I) 1-1|15',...refsFor(rs)],cells:rs.length?cellsOf(rs):[m.debit>=0?L(H,m.debit):null,m.credit>=0?L(H,m.credit):null,m.amount>=0?L(H,m.amount):null].filter(Boolean)});
    R('balance','flag',`out by ${fmt(diff)}${rs.length?` · ${rs.length} rows in unbalanced journals`:''}`)}}}

 if(run('dup')){
  if(isTB)tbSkip('dup');else if(!hasAmt||(m.date<0&&m.account<0))R('dup','skip','needs an amount plus Date or Account');
  else{const g={};data.forEach(d=>{const a=amt(d.row);if(!a)return;const k=[m.date>=0?d.row[m.date]:'',m.account>=0?d.row[m.account]:'',Math.round(a*100),m.desc>=0?String(d.row[m.desc]).toLowerCase():''].join('|');(g[k]=g[k]||[]).push(d)});
   const groups=Object.values(g).filter(v=>v.length>1&&(m.ref<0||new Set(v.map(d=>d.row[m.ref])).size>1));
   if(!groups.length)R('dup','pass','no duplicate lines found');
   else{const rs=groups.flat(),extra=groups.flatMap(v=>v.slice(1));
    add({test:'dup',title:`${groups.length} set${groups.length>1?'s':''} of possible duplicate entries`,description:`Lines with the same date, account, amount and description posted more than once (value of the extra copies shown).\n${sample(rs,6)}\nVouch to source documents to confirm the transactions occurred only once.`,amount:gross(extra),category:'Error',assertion:'Occurrence',minRisk:'Low',fsLine:lineFor(rs),refs:['SSA 240|32','SSA 500|9','SSA 530|12',...refsFor(rs)],cells:cellsOf(rs)});
    R('dup','flag',`${groups.length} duplicate set(s), ${rs.length} rows`)}}}

 if(run('round')){
  if(isTB)tbSkip('round');else if(!hasAmt)R('round','skip','no amount column mapped');
  else{const lim=Math.max(1000,t.triv);const rs=data.filter(d=>{const a=Math.abs(amt(d.row));return a>=lim&&Math.abs(a%1000)<0.005});
   if(!rs.length)R('round','pass',`no round amounts ≥ ${fmt0(lim)}`);
   else{add({test:'round',title:`${rs.length} round-sum entr${rs.length>1?'ies':'y'} (multiples of 1,000)`,description:`Round amounts can indicate estimates, manual adjustments or management override. Inspect support and approval.\n${sample(rs)}`,amount:gross(rs),category:'Fraud risk',assertion:'Occurrence',minRisk:'Medium',fsLine:lineFor(rs),refs:['SSA 240|32','SSA 240|31',...refsFor(rs)],cells:cellsOf(rs)});
    R('round','flag',`${rs.length} lines`)}}}

 if(run('weekend')){
  if(m.date<0)R('weekend','skip','no date column mapped');
  else{const rs=dated.filter(d=>d.dt&&(d.dt.getUTCDay()===0||d.dt.getUTCDay()===6)&&amt(d.row)!==0);
   if(!rs.length)R('weekend','pass','no Saturday/Sunday postings');
   else{add({test:'weekend',title:`${rs.length} entr${rs.length>1?'ies':'y'} posted on a weekend`,description:`Postings dated Saturday or Sunday fall outside normal processing and are a common journal-entry testing criterion. Confirm authorisation and business rationale.\n${sample(rs)}`,amount:gross(rs),category:'Fraud risk',assertion:'Occurrence',minRisk:'Medium',fsLine:lineFor(rs),refs:['SSA 240|32',...refsFor(rs)],cells:cellsOf(rs)});
    R('weekend','flag',`${rs.length} lines`)}}}

 if(run('cutoff')){
  if(m.date<0||!pe)R('cutoff','skip',m.date<0?'no date column mapped':'set the financial year end on Overview');
  else{const after=dated.filter(d=>d.dt&&d.dt>pe&&amt(d.row)!==0);const near=dated.filter(d=>d.dt&&d.dt<=pe&&dayDiff(pe,d.dt)<=7&&Math.abs(amt(d.row))>=t.triv&&amt(d.row)!==0);
   if(after.length)add({test:'cutoff',title:`${after.length} entr${after.length>1?'ies':'y'} dated after year end (${S.eng.periodEnd})`,description:`Transactions dated after the reporting date appear in this period's records. Determine whether they belong to the next period or are adjusting events.\n${sample(after)}`,amount:gross(after),category:'Cut-off',assertion:'Cut-off',minRisk:'High',fsLine:lineFor(after),refs:['SSA 330|18','SSA 560|6','SFRS(I) 1-10|8','SFRS(I) 15|31',...refsFor(after)],cells:cellsOf(after)});
   if(near.length)add({test:'cutoff',title:`${near.length} entr${near.length>1?'ies':'y'} in the last 7 days before year end`,description:`Period-end postings above the clearly-trivial threshold. Test for cut-off by agreeing to delivery / service evidence.\n${sample(near)}`,amount:gross(near),category:'Cut-off',assertion:'Cut-off',minRisk:'Low',fsLine:lineFor(near),refs:['SSA 330|18','SSA 240|32','SFRS(I) 15|31',...refsFor(near)],cells:cellsOf(near)});
   R('cutoff',after.length||near.length?'flag':'pass',after.length||near.length?`${after.length} after year end · ${near.length} in final week`:'no cut-off exceptions')}}

 if(run('blank')){
  if(m.desc<0&&m.ref<0)R('blank','skip','map Description or JE / Ref no.');
  else{const rs=data.filter(d=>amt(d.row)!==0&&((m.desc>=0&&String(d.row[m.desc]).trim()==='')||(m.ref>=0&&String(d.row[m.ref]).trim()==='')));
   if(!rs.length)R('blank','pass','all lines have a description and reference');
   else{add({test:'blank',title:`${rs.length} line${rs.length>1?'s':''} missing a description or reference`,description:`Entries without narration or reference are harder to trace to support and are a journal-entry risk criterion.\n${sample(rs)}`,amount:gross(rs),category:'Documentation',assertion:'Occurrence',minRisk:'Low',fsLine:lineFor(rs),refs:['SSA 230|9','SSA 500|9','SSA 240|32',...refsFor(rs)],cells:rs.map(d=>L(d.i,m.desc>=0&&String(d.row[m.desc]).trim()===''?m.desc:m.ref))});
    R('blank','flag',`${rs.length} lines`)}}}

 if(run('large')){
  if(isTB)tbSkip('large');else if(!t.mat)R('large','skip','set materiality on Overview');else if(!hasAmt)R('large','skip','no amount column mapped');
  else{const seen=new Set();const rs=data.filter(d=>{const a=Math.abs(amt(d.row));if(a<t.pm)return false;const k=(m.ref>=0?d.row[m.ref]:(m.date>=0?d.row[m.date]:d.i))+'|'+Math.round(a*100);if(seen.has(k))return false;seen.add(k);return true});
   if(!rs.length)R('large','pass',`no single line ≥ ${fmt0(t.pm)}`);
   else{rs.slice(0,25).forEach(d=>{const a=Math.abs(amt(d.row)),k=kw(text(d.row));add({test:'large',title:`Material single entry: ${([m.account>=0?d.row[m.account]:'',m.desc>=0?d.row[m.desc]:''].filter(x=>String(x).trim()).join(' — ')||'Line '+(sh.r0+d.i+1))}`.slice(0,110),description:`${sample([d],1)}\nAmount exceeds performance materiality (${fmt(t.pm)}); test 100% to supporting evidence rather than by sampling.`,amount:a,category:'Material item',assertion:'Existence',minRisk:'Medium',fsLine:k.line,refs:['SSA 330|18','SSA 320|11',...k.refs],cells:[L(d.i,amtCol(d.row))]})});

  else if(m.date>=0)R('abnormal','skip','applies to trial balances (sheet has a date column — looks like a ledger)');
  else{const g={};data.forEach(d=>{const k=String(d.row[m.account]);(g[k]=g[k]||[]).push(d)});
   const ASSET=/cash|bank|receivable|debtor|inventor|stock|prepay|deposit|equipment|plant|property|vehicle|right[- ]of[- ]use/i,LIAB=/payable|creditor|accru|loan|borrowing|provision|deferred revenue|lease liabilit/i;

    add({test:'abnormal',title:`${acc} has an abnormal ${bad} balance`,description:`Net balance ${fmt(net)}. ${bad==='credit'?'An asset account':'A liability account'} with a ${bad} balance may indicate misclassification, unrecorded transactions or improper offsetting — consider reclassification.`,amount:Math.abs(net),category:'Classification',assertion:'Classification',minRisk:'Medium',fsLine:k.line,refs:['SFRS(I) 1-1|32','SSA 330|20',...k.refs],cells:cellsOf(rs)})});

 openModal(`<h2>${isNew?'Add user':'Edit user'}</h2>
  <div class="form-grid" style="margin-top:14px">
   <div><label class="f">Username</label><input class="in" id="uName" value="${esc(p?p.username:'')}" ${isNew?'':'disabled'} autocapitalize="none" spellcheck="false" placeholder="e.g. sarah"></div>
   <div><label class="f">Full name</label><input class="in" id="uFull" value="${esc(p?p.full_name||'':'')}" placeholder="e.g. Sarah Lim"></div>
   <div><label class="f">Role</label><select class="in" id="uRole"><option value="member" ${p&&p.role==='admin'?'':'selected'}>Member — run tests &amp; manage issues</option><option value="admin" ${p&&p.role==='admin'?'selected':''}>Admin — also manage users</option></select></div>
   ${isNew?'<div><label class="f">Initial password</label><input class="in" id="uPw" type="text" autocomplete="off" value="password"></div>':''}
   <div class="full err" id="uErr" hidden></div>
  </div>
  ${isNew?'<p class="small muted">Share the username and initial password with the user. They will be asked to choose their own password at first sign-in.</p>':''}
  <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="uSave">${isNew?'Add user':'Save'}</button></div>`,true);
 $('#uSave').onclick=async()=>{const btn=$('#uSave');btn.disabled=true;$('#uErr').hidden=true;
  try{if(isNew){const u=$('#uName').value.trim().toLowerCase();await rpc('admin_create_user',{p_username:u,p_password:$('#uPw').value,p_full_name:$('#uFull').value.trim(),p_role:$('#uRole').value});closeModal();toast(`User @${u} added`)}
   else{await rpc('admin_update_user',{p_user_id:p.id,p_full_name:$('#uFull').value.trim(),p_role:$('#uRole').value});closeModal();toast('User updated')}}
  catch(err){const e=$('#uErr');e.textContent=authMsg(err);e.hidden=false;btn.disabled=false}};
 setTimeout(()=>$(isNew?'#uName':'#uFull')?.focus(),30)}
function resetPwForm(p){
 openModal(`<h2>Reset password</h2><p class="muted">Set a new initial password for <strong>@${esc(p.username)}</strong>. They'll be asked to change it at next sign-in.</p>
  <label class="f">New initial password</label><input class="in" id="rPw" type="text" autocomplete="off" value="password"><div class="err" id="rErr" hidden style="margin-top:12px"></div>
  <div class="foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="rSave">Reset password</button></div>`,true);
 $('#rSave').onclick=async()=>{try{await rpc('admin_set_password',{p_user_id:p.id,p_password:$('#rPw').value},`Password reset for @${p.username}`);closeModal()}catch(err){const e=$('#rErr');e.textContent=authMsg(err);e.hidden=false}}}

/* ---------- Migrate pre-login browser data ---------- */
const MIG_KEY='auditTracker.migrated.v1';
function localCounts(){const m=LOCAL_OLD.main||{};return{issues:(m.issues||[]).length,files:(LOCAL_OLD.files||[]).length}}
function migrateBanner(){if(lsGet(MIG_KEY))return'';const c=localCounts();if(!c.issues&&!c.files)return'';
 return `<div class="card migrate"><div><strong>Data found in this browser</strong><div class="muted small">${c.issues} issue${c.issues===1?'':'s'} and ${c.files} file${c.files===1?'':'s'} were saved here before sign-in was added. Move them into the shared Supabase workspace?</div></div>
  <div class="btn-row"><button class="btn sm ghost" data-act="migskip">Not now</button><button class="btn sm primary" data-act="migrate">Import to workspace</button></div></div>`}
function migrateLocal(){
 const m=LOCAL_OLD.main||{},ids=new Set(S.issues.map(i=>i.id)),fids=new Set(FILES.map(f=>f.id));let ni=0,nf=0;
 (LOCAL_OLD.files||[]).forEach(f=>{if(!fids.has(f.id)){FILES.push(f);nf++}});
 (m.issues||[]).forEach(i=>{if(!ids.has(i.id)){S.issues.push(i);ni++}});
 if(m.eng&&!S.eng.mat&&!S.eng.entity)S.eng=Object.assign(blank().eng,m.eng);
 lsSet(MIG_KEY,{at:Date.now(),by:ME.username});save();render();toast(`Imported ${ni} issues and ${nf} files to the workspace`)}

/* ---------- auth-related click actions ---------- */
function authAct(a,b,e){
 if(a==='umenu'){$('#umenu').classList.toggle('on');return true}
 if(a==='signout'){signOut();return true}
 if(a==='chpw'){$('#umenu')?.classList.remove('on');passwordModal(false);return true}
 if(a==='gousers'){go('users');return true}
 if(a==='syncretry'){if(syncState==='error')save();return true}
 if(a==='useradd'){userForm(null);return true}
 const p=PROFILES.find(x=>x.id===b.dataset.id);
 if(a==='useredit'&&p){userForm(p);return true}
 if(a==='userpw'&&p){resetPwForm(p);return true}
 if(a==='useractive'&&p){confirmBox(p.active?'Deactivate user?':'Reactivate user?',p.active?`@${esc(p.username)} will be signed out and unable to sign in. Their issues and history are kept.`:`@${esc(p.username)} will be able to sign in again.`,p.active?'Deactivate':'Reactivate',async()=>{try{await rpc('admin_set_active',{p_user_id:p.id,p_active:!p.active},p.active?'User deactivated':'User reactivated')}catch(err){toast(authMsg(err))}});return true}
 if(a==='migrate'){migrateLocal();return true}
 if(a==='migskip'){lsSet(MIG_KEY,{skipped:Date.now()});render();return true}
 return false}

async function boot(){
 if(!sb)return showLogin();
 sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&ME){ME=null;showLogin('Your session ended. Please sign in again.')}});
 try{const {data:{session}}=await sb.auth.getSession();if(session&&session.user)await onSignedIn(session.user);else showLogin()}
 catch(err){showLogin(authMsg(err),true)}}

boot();
</script>
</body>
</html>
